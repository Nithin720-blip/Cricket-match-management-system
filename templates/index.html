<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Match Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --dark-bg: #050507;
            --dark-surface: #0f0f13;
            --border-hard: #2a2a35;
            --text-primary: #ffffff;
            --text-muted: #888899;
            
            /* Aggressive Accent Colors */
            --accent-primary: #ff3300; /* Fiery Orange/Red for Admin */
            --accent-secondary: #00e676; /* Radioactive Green for User */
            --accent-glow: #ffae00; /* Spark Yellow */
            
            /* Brutalist Shadows */
            --shadow-brutal-admin: 12px 12px 0px rgba(255, 51, 0, 0.9);
            --shadow-brutal-user: 12px 12px 0px rgba(0, 230, 118, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-primary);
            position: relative;
        }

        /* -----------------------------------
           RUGGED BACKGROUND EFFECTS
        ------------------------------------ */
        .background-container {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: -2;
            background-color: var(--dark-bg);
        }

        /* Sweeping Stadium Spotlight Effect */
        .animated-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 51, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 50%, rgba(0, 230, 118, 0.1) 0%, transparent 40%);
            animation: pulseSpotlights 8s infinite alternate ease-in-out;
            filter: blur(40px);
        }

        @keyframes pulseSpotlights {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Industrial Carbon/Radar Grid */
        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 2px, transparent 2px);
            background-size: 60px 60px;
            opacity: 0.8;
        }

        /* Rising Embers (Replaced soft particles) */
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            background: var(--accent-glow);
            border-radius: 2px; /* Sharp sparks instead of circles */
            box-shadow: 0 0 10px var(--accent-glow);
            animation: riseEmber 5s infinite ease-in;
            opacity: 0;
        }

        /* Randomizing the sparks */
        .particle:nth-child(1) { width: 3px; height: 12px; left: 15%; animation-duration: 4s; animation-delay: 0s; }
        .particle:nth-child(2) { width: 2px; height: 8px; left: 25%; animation-duration: 6s; animation-delay: 1s; }
        .particle:nth-child(3) { width: 4px; height: 15px; left: 35%; animation-duration: 5s; animation-delay: 2s; }
        .particle:nth-child(4) { width: 2px; height: 6px; left: 45%; animation-duration: 7s; animation-delay: 0.5s; }
        .particle:nth-child(5) { width: 3px; height: 10px; left: 55%; animation-duration: 4.5s; animation-delay: 1.5s; }
        .particle:nth-child(6) { width: 5px; height: 18px; left: 65%; animation-duration: 5.5s; animation-delay: 0.8s; }
        .particle:nth-child(7) { width: 2px; height: 7px; left: 75%; animation-duration: 6.5s; animation-delay: 2.2s; }
        .particle:nth-child(8) { width: 4px; height: 14px; left: 85%; animation-duration: 4.8s; animation-delay: 0.3s; }
        .particle:nth-child(9) { width: 3px; height: 9px; left: 95%; animation-duration: 5.2s; animation-delay: 1.7s; }

        @keyframes riseEmber {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(0); opacity: 0; }
        }

        /* -----------------------------------
           MAIN LAYOUT & TYPOGRAPHY
        ------------------------------------ */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            max-width: 1200px;
            width: 100%;
        }

        /* Massive, Rugged Title */
        .title-wrapper {
            margin-bottom: 4rem;
            position: relative;
        }

        .main-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 0.9;
            color: #ffffff;
            text-shadow: 
                0px 4px 0px #444,
                0px 10px 30px rgba(0,0,0,0.9);
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
        }

        /* Glitch/Tech underlay for title */
        .main-title::before {
            content: attr(data-text);
            position: absolute;
            left: -4px;
            text-shadow: 2px 0 var(--accent-primary);
            top: 0;
            color: transparent;
            background: transparent;
            z-index: -1;
            opacity: 0.5;
        }

        /* -----------------------------------
           BRUTALIST ACTION CARDS
        ------------------------------------ */
        .action-cards {
            display: flex;
            gap: 3.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .action-card {
            position: relative;
            background: var(--dark-surface);
            border: 2px solid var(--border-hard);
            border-radius: 4px; /* Sharp, aggressive corners */
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: var(--text-primary);
            width: 320px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            cursor: pointer;
            z-index: 1;
        }

        /* Admin Card Styling */
        .admin-card {
            box-shadow: var(--shadow-brutal-admin);
        }
        
        /* User Card Styling */
        .user-card {
            box-shadow: var(--shadow-brutal-user);
        }

        /* Hover Slash Effect */
        .action-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: rgba(255,255,255,0.05);
            transform: skewX(-20deg);
            transition: 0.5s;
            z-index: -1;
        }

        .action-card:hover {
            transform: translateY(-8px) translateX(-4px);
            background: #15151a;
        }

        .admin-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 16px 16px 0px rgba(255, 51, 0, 1);
        }

        .user-card:hover {
            border-color: var(--accent-secondary);
            box-shadow: 16px 16px 0px rgba(0, 230, 118, 1);
        }

        .action-card:hover::after {
            left: 200%;
        }

        .card-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 1.2rem;
            display: block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .admin-card .card-icon { color: var(--accent-primary); }
        .user-card .card-icon { color: var(--accent-secondary); }

        .action-card:hover .card-icon {
            transform: scale(1.15) translateY(-5px);
        }

        .admin-card:hover .card-icon { text-shadow: 0 0 20px rgba(255, 51, 0, 0.6); }
        .user-card:hover .card-icon { text-shadow: 0 0 20px rgba(0, 230, 118, 0.6); }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .action-card:hover .card-title {
            color: #fff;
        }

        /* -----------------------------------
           ANIMATIONS & LOADER
        ------------------------------------ */
        @keyframes stampIn {
            0% { opacity: 0; transform: scale(0.9) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .fade-in-up {
            animation: stampIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }

        /* Rugged Mechanical Loader */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: slideOutUp 0.6s cubic-bezier(0.8, 0, 0.2, 1) 1s forwards;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: var(--accent-primary);
            border-right-color: var(--accent-secondary);
            border-radius: 2px; /* Square, mechanical spin */
            animation: mechanicalSpin 0.8s steps(4) infinite;
        }

        @keyframes mechanicalSpin {
            100% { transform: rotate(360deg); }
        }

        @keyframes slideOutUp {
            to { transform: translateY(-100%); opacity: 0; visibility: hidden; }
        }

        /* Responsive Design adjustments for brutalism */
        @media (max-width: 768px) {
            .main-title { font-size: clamp(3rem, 12vw, 4.5rem); }
            .action-cards { gap: 2rem; }
            .action-card { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="background-container">
        <div class="animated-bg"></div>
        <div class="grid-overlay"></div>
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="hero-section">
            <div class="title-wrapper fade-in-up">
                <h1 class="main-title" data-text="Cricket Match Management System">Cricket Match Management System</h1>
            </div>

            <div class="action-cards">
                <a href="/admin/login" class="action-card admin-card fade-in-up delay-1">
                    <div class="card-content">
                        <i class="fas fa-user-shield card-icon"></i>
                        <h3 class="card-title">Admin</h3>
                    </div>
                </a>

                <a href="/user/dashboard" class="action-card user-card fade-in-up delay-2">
                    <div class="card-content">
                        <i class="fas fa-users card-icon"></i>
                        <h3 class="card-title">User</h3>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ripple effect updated to match rugged aesthetic
            document.querySelectorAll('.action-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const ripple = document.createElement('div');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    // Determine color based on card type
                    const rippleColor = this.classList.contains('admin-card') ? 'rgba(255, 51, 0, 0.4)' : 'rgba(0, 230, 118, 0.4)';

                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        background: ${rippleColor};
                        border-radius: 4px; /* Square ripple */
                        transform: scale(0);
                        animation: rippleEffect 0.6s ease-out;
                        left: ${x}px;
                        top: ${y}px;
                        pointer-events: none;
                        z-index: 1;
                    `;
                    
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            });

            // Parallax effect logic remains completely intact
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                document.querySelector('.animated-bg').style.transform = 
                    `translate(${mouseX * 20}px, ${mouseY * 20}px)`;
                
                document.querySelector('.grid-overlay').style.transform = 
                    `translate(${mouseX * 10}px, ${mouseY * 10}px)`;

                document.querySelectorAll('.particle').forEach((particle, index) => {
                    const speed = (index + 1) * 0.5;
                    particle.style.transform = 
                        `translate(${mouseX * speed}px, ${mouseY * speed}px)`;
                });
            });
        });

        // Add ripple animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    transform: scale(2.5);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
