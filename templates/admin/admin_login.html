<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Management Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --primary-blue-light: #3b82f6;
            --secondary-gray: #64748b;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border-primary: #e2e8f0;
            --border-secondary: #cbd5e1;
            --border-focus: #2563eb;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --error-border: #fecaca;
            --success-bg: #f0fdf4;
            --success-text: #166534;
            --success-border: #bbf7d0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg,rgb(23, 105, 188) 0%,rgb(62, 110, 173) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-container {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-primary);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: var(--bg-primary);
            padding: 48px 40px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-primary);
        }

        .login-header .logo {
            width: 64px;
            height: 64px;
            background: var(--primary-blue);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: var(--shadow-lg);
        }

        .login-header .logo i {
            font-size: 28px;
            color: white;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .login-header p {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .login-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
            letter-spacing: -0.025em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .form-control {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 400;
            transition: all 0.2s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .form-control::placeholder {
            color: var(--text-light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .form-control:focus + .input-wrapper i {
            color: var(--primary-blue);
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.5;
            letter-spacing: -0.025em;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--border-secondary);
            color: var(--text-primary);
        }

        .alert {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid;
        }

        .alert-error {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-border);
        }

        .alert-error i {
            color: var(--error-text);
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-border);
        }

        .alert-success i {
            color: var(--success-text);
        }

        .forgot-password {
            text-align: center;
            margin-top: 24px;
        }

        .forgot-password a {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .forgot-password a:hover {
            color: var(--primary-blue-hover);
            text-decoration: underline;
        }

        /* Form Toggle Specific Styles */
        .form-section {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-section.hidden {
            opacity: 0;
            transform: translateY(16px);
            height: 0;
            overflow: hidden;
            margin-bottom: 0;
            padding: 0;
        }

        .form-section:not(.hidden) {
            opacity: 1;
            transform: translateY(0);
            height: auto;
        }

        /* Loading state */
        .btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                border-radius: var(--radius-md);
            }

            .login-header {
                padding: 32px 24px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-header p {
                font-size: 14px;
            }

            .login-body {
                padding: 32px 24px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .btn {
                padding: 14px 20px;
                font-size: 15px;
            }
        }

        /* Focus States */
        .form-control:focus-visible,
        .btn:focus-visible,
        .forgot-password a:focus-visible {
            outline: 2px solid var(--primary-blue);
            outline-offset: 2px;
        }

        .form-control.error {
            border-color: var(--error-text);
            background-color: var(--error-bg);
        }

        .form-control.error:focus {
            border-color: var(--error-text);
            box-shadow: 0 0 0 3px rgb(220 38 38 / 0.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Admin Portal</h1>
            <p id="headerSubtitle">Secure Management Access</p>
        </div>

        <div class="login-body">
            <div id="loginFormSection" class="form-section">
                {% if error %}
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post" action="/admin/login" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                value="{{ username_login }}"
                                required
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                    </button>
                </form>

                <div class="forgot-password">
                    <a href="#" id="showResetPassword">Forgot your password?</a>
                </div>
            </div>

            <div id="resetPasswordFormSection" class="form-section hidden">
                {% if reset_message %}
                    {{ reset_message | safe }}
                {% endif %}
                <form method="post" action="/admin/login" id="resetPasswordForm" novalidate>
                    <input type="hidden" name="action" value="reset_password_direct">
                    <div class="form-group">
                        <label for="reset_username">Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input
                                type="text"
                                id="reset_username"
                                name="reset_username"
                                class="form-control"
                                placeholder="Enter your username"
                                value="{{ reset_username }}"
                                required
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-key"></i>
                            <input
                                type="password"
                                id="new_password"
                                name="new_password"
                                class="form-control"
                                placeholder="Enter new password"
                                required
                                autocomplete="new-password"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm new password"
                                required
                                autocomplete="new-password"
                            />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="resetPasswordBtn">
                        <span class="btn-text">Reset Password</span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="backToLogin">
                        <i class="fas fa-arrow-left"></i>
                        <span class="btn-text">Back to Login</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const loginFormSection = document.getElementById('loginFormSection');
        const resetPasswordFormSection = document.getElementById('resetPasswordFormSection');
        const showResetPasswordLink = document.getElementById('showResetPassword');
        const backToLoginBtn = document.getElementById('backToLogin');
        const headerSubtitle = document.getElementById('headerSubtitle');
        const loginForm = document.getElementById('loginForm');
        const resetPasswordForm = document.getElementById('resetPasswordForm');

        function showLoginForm() {
            resetPasswordFormSection.classList.add('hidden');
            loginFormSection.classList.remove('hidden');
            headerSubtitle.textContent = 'Secure Management Access';
            document.getElementById('username').focus();
            const loginAlert = loginFormSection.querySelector('.alert');
            if (loginAlert) loginAlert.remove();
        }

        function showResetPasswordForm() {
            loginFormSection.classList.add('hidden');
            resetPasswordFormSection.classList.remove('hidden');
            headerSubtitle.textContent = 'Reset Your Password';
            document.getElementById('reset_username').focus();
            const resetAlert = resetPasswordFormSection.querySelector('.alert');
            if (resetAlert) resetAlert.remove();
        }

        showResetPasswordLink.addEventListener('click', function(event) {
            event.preventDefault();
            showResetPasswordForm();
        });

        backToLoginBtn.addEventListener('click', function() {
            showLoginForm();
        });

        loginForm.addEventListener('submit', function(event) {
            const loginBtn = document.getElementById('loginBtn');
            const usernameField = document.getElementById('username');
            const passwordField = document.getElementById('password');
            let isValid = true;

            if (usernameField.value.trim() === '') {
                usernameField.classList.add('error');
                isValid = false;
            } else {
                usernameField.classList.remove('error');
            }

            if (passwordField.value.trim() === '') {
                passwordField.classList.add('error');
                isValid = false;
            } else {
                passwordField.classList.remove('error');
            }

            if (!isValid) {
                event.preventDefault();
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            loginBtn.querySelector('.btn-text').textContent = 'Signing In...';
        });

        resetPasswordForm.addEventListener('submit', function(event) {
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');
            const resetUsernameField = document.getElementById('reset_username');
            const newPasswordField = document.getElementById('new_password');
            const confirmPasswordField = document.getElementById('confirm_password');
            let isValid = true;

            if (resetUsernameField.value.trim() === '') {
                resetUsernameField.classList.add('error');
                isValid = false;
            } else {
                resetUsernameField.classList.remove('error');
            }

            if (newPasswordField.value.trim() === '') {
                newPasswordField.classList.add('error');
                isValid = false;
            } else {
                newPasswordField.classList.remove('error');
            }

            if (confirmPasswordField.value.trim() === '') {
                confirmPasswordField.classList.add('error');
                isValid = false;
            } else {
                confirmPasswordField.classList.remove('error');
            }

            if (newPasswordField.value !== confirmPasswordField.value && newPasswordField.value !== '' && confirmPasswordField.value !== '') {
                newPasswordField.classList.add('error');
                confirmPasswordField.classList.add('error');
                alert('New password and confirm password do not match.');
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
                return;
            }

            resetPasswordBtn.classList.add('loading');
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.querySelector('.btn-text').textContent = 'Resetting...';
        });

        document.addEventListener('DOMContentLoaded', function() {
            const usernameLoginField = document.getElementById('username');
            const passwordLoginField = document.getElementById('password');
            const resetUsernameField = document.getElementById('reset_username');

            const resetAlert = resetPasswordFormSection.querySelector('.alert');
            if (resetAlert) {
                showResetPasswordForm();
                if (resetAlert.classList.contains('alert-success')) {
                    setTimeout(showLoginForm, 5000);
                } else {
                    resetUsernameField.focus();
                }
            } else if (usernameLoginField.value === '' && loginFormSection.classList.contains('hidden') === false) {
                usernameLoginField.focus();
            } else if (passwordLoginField.value === '' && loginFormSection.classList.contains('hidden') === false) {
                passwordLoginField.focus();
            } else if (resetPasswordFormSection.classList.contains('hidden') === false) {
                resetUsernameField.focus();
            }
        });

        const allInputs = document.querySelectorAll('.form-control');
        allInputs.forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.classList.add('error');
                } else {
                    this.classList.remove('error');
                }
            });
            input.addEventListener('input', function() {
                if (this.classList.contains('error')) {
                    this.classList.remove('error');
                }
            });
        });

        window.addEventListener('load', function() {
            const loginError = document.querySelector('#loginFormSection .alert-error');
            const resetAlert = document.querySelector('#resetPasswordFormSection .alert');

            if (resetAlert) {
                showResetPasswordForm();
            } else if (loginError) {
                showLoginForm();
            }
        });
    </script>
</body>
</html>
